<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HATROB AR • QR</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:16px;background:#f4f7fa;color:#172334}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.top img{height:46px}.top .hat{height:58px}.top button{margin-left:auto;padding:10px 13px;border:1px solid #ccd5df;border-radius:11px;background:white;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:white;border:1px solid #dfe6ec;border-radius:16px;padding:13px;text-align:center}.name{font-weight:900;margin-bottom:5px}.size{font-size:11px;color:#657789;margin-bottom:9px}canvas{background:white;padding:7px;border:1px solid #edf0f3;border-radius:10px}.hint{font-size:11px;color:#657789;margin-top:7px}.foot{text-align:center;font-size:11px;color:#7a8997;padding:16px}@media print{.top button{display:none}.card{break-inside:avoid}body{background:#fff}}
</style></head>
<body>
<div class="top"><img src="assets/maku_logo.png" alt="MAKÜ"><div><b>Hassas Tarım ve Tarımsal Robotlar Bölümü Sanal Laboratuvarı</b><div style="font-size:12px;color:#657789">Her model için tek QR • cihaz otomatik uyarlanır</div></div><img class="hat" src="assets/hatrob_logo.png" alt="HATROB"><button onclick="window.print()">Yazdır</button></div>
<div class="grid" id="grid"></div><div class="foot">Bu uygulama Dr. Tahsin UYGUN tarafından hazırlanmıştır.</div>
<script src="app.js"></script>
<script>
const api=window.HATROB,grid=document.getElementById("grid");
(async()=>{try{
 const {models}=await api.getRepoFiles();
 const base=location.origin+location.pathname.replace(/\/[^/]*$/,"/");
 if(!models.length){grid.innerHTML="<div class='card'>Model bulunamadı.</div>";return}
 for(const m of models){
  const url=base+"index.html?f="+encodeURIComponent(m.path);
  const c=document.createElement("div");c.className="card";
  c.innerHTML="<div class='name'>"+api.niceNameFromPath(m.path)+"</div><div class='size'>"+api.formatBytes(m.size)+"</div><canvas></canvas><div class='hint'>QR okut → modeli seçili aç → Modeli Yükle</div>";
  grid.appendChild(c);await QRCode.toCanvas(c.querySelector("canvas"),url,{width:180,margin:1});
 }
}catch(e){console.error(e);grid.innerHTML="<div class='card'>Liste alınamadı.</div>"}})();
</script></body></html>
